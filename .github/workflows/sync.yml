name: Sync LeetCode Solutions

on:
  workflow_dispatch: # Allows you to run it manually anytime
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8:00 AM UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.7.0
        with:
          github-token: ${{ secrets.KITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions' # Subfolder where code will be saved
          verbose: true
          commit-header: 'Sync LeetCode'
